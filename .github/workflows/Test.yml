name: KernelSU Forks Liquid
on:
  workflow_dispatch:
    inputs:
      FILE:
        type: choice
        description: "Configuration File"
        required: true
        default: oneplus_13_b
        options:
          - oneplus_10r_v
          - oneplus_nord_3_v
          - oneplus_ace_v
          - oneplus_ace_race_v
          - oneplus_10_pro_v
          - oneplus_10t_v
          - oneplus_11r_b
          - oneplus_ace2_b
          - oneplus_pad_lite_v
          - oneplus_pad_mt6983_b
          - oneplus_ace_2v_v
          - oneplus_ace_pro_v
          - oneplus_11_b
          - oneplus_12r_b
          - oneplus_ace2_pro_b
          - oneplus_ace3_b
          - oneplus_open_b
          - oneplus_nord_ce4_b
          - oneplus_12_b
          - oneplus_pad_go_2_b
          - oneplus_nord_ce4_lite_5g_v
          - oneplus_nord_4_b
          - oneplus_ace_3v_b
          - oneplus_pad_mt6897_v
          - oneplus_13r_b
          - oneplus_ace3_pro_b
          - oneplus_ace5_b
          - oneplus_pad_pro_b
          - oneplus_pad2_b
          - oneplus_nord_ce5_b
          - oneplus_nord_5_b
          - oneplus_ace5_pro_b
          - oneplus_13_b
          - oneplus_13t_b
          - oneplus_13s_b
          - oneplus_pad_2_pro_b
          - oneplus_pad_3_b
          - oneplus_ace5_race_b
          - oneplus_ace5_ultra_b
          - oneplus_pad2_mt6991_b
          - oneplus_ace_6
          - oneplus_ace_6t
          - oneplus_ace_6t_aosp
          - oneplus_15r
          - oneplus_15r_aosp
          - oneplus_15
          - oneplus_15_aosp
      KPM:
        type: choice
        description: "Kernel Module Implementation Methods"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - NoN
      SUSFS_META:
        type: string
        description: "Rollback SUSFS (Enter Hash or Number or -1 to Turn Off)"
        required: false
        default: ""
      DYNAMIC_REPO:
        type: string
        description: "Dynamic Inventory Warehouse Owner"
        required: true
        default: "KingMikhail"
      BUILD_TIME:
        type: string
        description: "Custom Build Time (Type F to Use Current UTC Time)"
        required: false
        default: "Sat Feb 14 07:17:27 UTC 2026"
      KSU_META:
        type: choice
        description: "Root Manager"
        required: true
        default: "ReSukiSU"
        options:
         - ReSukiSU
         - SukiSU-Ultra
         - KernelSU-Next
         - MKernelSU
         - KernelSU
      ZRAM:
        type: string
        description: "ZRAM (0 for Off, 1 for On)/Algorithm Name/Size"
        required: true
        default: "0/lz4kd/8589934592"
      SUFFIX:
        type: string
        description: "Custom kernel suffix (use random string if not specified)"
        required: false
        default: "8-andreimikhail-4k"
      SUBLEVEL:
        description: "Custom kernel level spoofing (SUBLEVEL)"
        required: false
        default: ""
      FAST_BUILD:
        type: boolean
        description: "Enable rapid build?"
        required: true
        default: true
      LSM:
        type: boolean
        description: "Enable Critical Partition Write Protection (BBG)?"
        required: true
        default: true
      NETFILTER:
        type: boolean
        description: "Enable Network Feature Extensions (NETFILTER)?"
        required: true
        default: true
      BBR_ECN:
        type: boolean
        description: "Enable Network Optimization Algorithm (BBR+ECN)?"
        required: true
        default: true
      UNICODE_BYPASS:
        type: boolean
        description: "Add Fix for Unicode Invisible Code Point Bypass Read Vulnerability?"
        required: true
        default: true
      SCHED:
        type: boolean
        description: "Add Windspeed Driver 1.0?"
        required: true
        default: true
      XUS_FIX:
        type: boolean
        description: "Prevent Generation of 5US Error Files?"
        required: true
        default: true
      SUSFS_DEV:
        type: boolean
        description: "Pull SUSFS-DEV Branch?"
        required: true
        default: false
      SPACE_NOCLEAN:
        type: boolean
        description: "Stop Space Cleaning?"
        required: true
        default: false
      BUILD_NOCCACHE:
        type: boolean
        description: "Disable Ccache Update?"
        required: true
        default: false

jobs:
  build:
    name:  Liquid Test
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize Build Space
        if: ${{ github.event.inputs.SPACE_NOCLEAN == 'false' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      # -----------------------------
      # Extract Manifest Information
      # -----------------------------     
      - name: Extract Manifest Information
        id: extract_info
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          if [[ "$FILE" =~ ^(.+)_([a-zA-Z])$ ]]; then
            FILE_CONF="${BASH_REMATCH[1]}"
          else
            FILE_CONF="$FILE"
          fi
          FILE_BASE=$(echo "$FILE_CONF" | sed -E 's/_aosp/(AOSP)/g; s/_([a-zA-Z0-9])/\U\1/g; s/^oneplus/OnePlus/; s/^realme/RealME/; s/^oppo/OPPO/')
          mkdir -p ".repo/manifests_fallback"
          XML_PATH=".repo/manifests_fallback/${FILE}.xml"
          README_PATH=".repo/manifests_fallback/README.md"
          echo "Deal with FILE=$FILE, CONF=$FILE_CONF, BASE=$FILE_BASE"
          echo "FILE_CONF=$FILE_CONF" >> $GITHUB_ENV
          echo "FILE_BASE=$FILE_BASE" >> $GITHUB_ENV

          # Dynamically Calling Source Code Manifest Repository, Repository Priority：1️⃣ KingMikhail OnePlusOSS Fork → 2️⃣ Appendix → 3️⃣ Dynamic
          DYNAMIC_REPO_INPUT="${{ github.event.inputs.DYNAMIC_REPO }}"
          declare -A REPOS
          REPOS["KingMikhail"]="KingMikhail|kernel_manifest"
          REPOS["Appendix"]="KingMikhail|Kernel_Manifest_Appendix"
          REPOS["Dynamic"]="${DYNAMIC_REPO_INPUT}|kernel_manifest"

          FOUND_REPO=""
          FOUND_BRANCH=""

          check_repo() {
            local ENTRY=$1
            local OWNER=${ENTRY%%|*}
            local REPO_NAME=${ENTRY##*|}
            local API_URL="https://api.github.com/repos/${OWNER}/${REPO_NAME}"

            echo "Try Pull Branch List of ${OWNER}/${REPO_NAME}..."
            BRANCHES=$(curl -fsL "$API_URL/branches" | jq -r 'if type=="array" then .[].name else empty end' 2>/dev/null || true)

            if [[ -z "$BRANCHES" ]]; then
              echo "${OWNER}/${REPO_NAME} Failed to Retrieve Branch List, Try Re-running Workflow"
              return 1
            fi
            for BRANCH in $BRANCHES; do
              XML_URL="https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/${FILE}.xml"
              README_URL="https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/README.md"

              if curl -sf --head "$XML_URL" >/dev/null; then
                echo "Locate ${FILE}.xml (branch: ${BRANCH}) Within ${OWNER}/${REPO_NAME}"
                curl -s -o "$XML_PATH" "$XML_URL"
                curl -s -o "$README_PATH" "$README_URL" || true

                FOUND_REPO="$OWNER"
                FOUND_REPO_NAME="$REPO_NAME"
                FOUND_BRANCH="$BRANCH"

                return 0
              fi
            done
            return 1
          }
          if ! check_repo "${REPOS["KingMikhail"]}"; then
            if ! check_repo "${REPOS["Appendix"]}"; then
              check_repo "${REPOS["Dynamic"]}"
            fi
          fi
          if [[ -z "$FOUND_REPO" || ! -s "$XML_PATH" ]]; then
            echo "Unable to Find in Any Warehouse ${FILE}.xml"
            exit 9
          fi
          echo "MANIFEST_REPO=$FOUND_REPO" >> "$GITHUB_ENV"
          echo "MANIFEST_REPO_NAME=$FOUND_REPO_NAME" >> "$GITHUB_ENV"
          echo "MANIFEST_BRANCH=$FOUND_BRANCH" >> "$GITHUB_ENV"

          # Parse Revision String
          REVISION=$(grep -oP '<project[^>]+revision="\K[^"]+' "$XML_PATH" | head -n1 || true)
          echo "Parse the File to Obtain CPU and Android Version..."
          # Extract CPU
          CPU=$(echo "$REVISION" | sed -E 's#^(oneplus|realme|oppo)/([^_]+).*#\2#')
          # Extract Android Version
          ANDROID_VERSION=$(echo "$REVISION" | grep -oP '\d{1,2}\.\d{1,2}(\.\d{1,2})?')
          if [[ -n "$CPU" && -n "$ANDROID_VERSION" ]]; then
            echo "CPU=$CPU, ANDROID_VERSION=$ANDROID_VERSION"
            echo "CPU=$CPU" >> $GITHUB_ENV
            echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV
            # Get Short Android Version Number
            echo "ANDROID_SHORT_VERSION=${ANDROID_VERSION%%.*}" >> $GITHUB_ENV
          else
            echo "Unable to extract CPU or Android Version from Revision"
            exit 1
          fi

          echo "Parse README.md to obtain CPUD and BUILD_METHOD..."
          if [[ -s "$README_PATH" ]]; then
            BUILD_LINE=$(grep -m1 'oplus_build_kernel.sh' "$README_PATH" || true)
            if [[ -n "$BUILD_LINE" ]]; then
              CPUD=$(echo "$BUILD_LINE" | awk '{print $(NF-1)}')
              BUILD_METHOD=$(echo "$BUILD_LINE" | awk '{print $NF}')
              echo "CPUD=$CPUD, BUILD_METHOD=$BUILD_METHOD"
              echo "CPUD=$CPUD" >> $GITHUB_ENV
              echo "BUILD_METHOD=$BUILD_METHOD" >> $GITHUB_ENV
            else
              echo "Build Command was Not Found in Readme.md"
            fi
          else
            echo "Download Failed or is Empty for Readme.md"
          fi

          echo "Parse FILE-K to obtain PATH_2..."
          PATH_2=""
          if [[ "$CPU" == sm* ]]; then
            COUNT_SM=0
            COUNT_MASTER=0
            while read -r LINE; do
              REV=$(echo "$LINE" | grep -oP 'revision="\K[^"]+' || true)
              PATH_VAL=$(echo "$LINE" | grep -oP 'path="\K[^"]+' || true)
              if [[ "$REV" =~ ^(oneplus|oppo)/ ]] && [[ -n "$PATH_VAL" ]]; then
                COUNT_SM=$((COUNT_SM + 1))
                if [[ $COUNT_SM -eq 2 ]]; then
                  PATH_2="${PATH_VAL#kernel_platform/}"
                  break
                fi
              elif [[ "$REV" == "master" ]] && [[ -n "$PATH_VAL" ]]; then
                COUNT_MASTER=$((COUNT_MASTER + 1))
                if [[ $COUNT_MASTER -eq 2 ]]; then
                  PATH_2="${PATH_VAL#kernel_platform/}"
                  break
                fi
              fi
            done < <(grep "<project " "$XML_PATH" || true)
          fi
          if [[ -n "$PATH_2" ]]; then
            echo "PATH_2=$PATH_2"
            echo "PATH_2=$PATH_2" >> "$GITHUB_ENV"
          else
            echo "No Matching PATH_2 Found, Could be Due to a Tianji Device or a Specific List that does Not Meet the Criteria, Skip this Step"
          fi

          # Convey Combined Information
          echo "value=${FILE_BASE}_Android${ANDROID_VERSION}" >> "$GITHUB_OUTPUT"
          
      # -----------------------------
      # Debug Show Selected Inputs
      # -----------------------------     
      - name: Debug Show Selected Inputs
        run: |
          echo "============================"
          echo "Selected CPU: ${{ env.CPU }}"
          echo "Selected CPUD: ${{ env.CPUD }}"
          echo "Selected ANDROID_VERSION: ${{ env.ANDROID_VERSION }}"
          echo "Selected BUILD_METHOD: ${{ env.BUILD_METHOD }}"
          echo "Selected FILE: ${{ github.event.inputs.FILE }}"
          echo "Selected KPM: ${{ github.event.inputs.KPM }}"
          echo "Custom SUSFS_META: ${{ github.event.inputs.SUSFS_META }}"
          echo "Custom KSU_META: ${{ github.event.inputs.KSU_META }}"
          echo "Selected ZRAM: ${{ github.event.inputs.ZRAM }}"
          echo "Custom BUILD_TIME: ${{ github.event.inputs.BUILD_TIME }}"
          echo -n "BUILD_TIME Unicode: "
          python3 -c "import unicodedata; print(''.join(f'\033[31mU+{ord(c):04X}\033[0m ' if c.isspace() or unicodedata.category(c)=='Cf' else f'U+{ord(c):04X} ' for c in '''${{ github.event.inputs.BUILD_TIME }}'''))"
          echo "Custom SUFFIX: ${{ github.event.inputs.SUFFIX }}"
          echo -n "SUFFIX Unicode: "
          python3 -c "import unicodedata; print(''.join(f'\033[31mU+{ord(c):04X}\033[0m ' if c.isspace() or unicodedata.category(c)=='Cf' else f'U+{ord(c):04X} ' for c in '''${{ github.event.inputs.SUFFIX }}'''))"
          echo "Selected LSM: ${{ github.event.inputs.LSM }}"
          echo "Selected NETFILTER: ${{ github.event.inputs.NETFILTER }}"
          echo "Selected BBR_ECN: ${{ github.event.inputs.BBR_ECN }}"
          echo "Selected SUSFS_DEV: ${{ github.event.inputs.SUSFS_DEV }}"
          echo "Selected FAST_BUILD: ${{ github.event.inputs.FAST_BUILD }}"
          echo "Selected SCHED: ${{ github.event.inputs.SCHED }}"
          echo "Selected UNICODE_BYPASS: ${{ github.event.inputs.UNICODE_BYPASS }}"
          echo "Selected XUS_FIX: ${{ github.event.inputs.XUS_FIX }}"
          echo "============================"

      # -----------------------------
      # Check Disk Space
      # -----------------------------     
      - name: Check Disk Space
        run: df -h

      # -----------------------------
      # Create and Enable 3G Swap
      # -----------------------------
      - name: Create and Enable 3G Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # -----------------------------
      # Set Cache Environment
      # -----------------------------
      - name: Set Cache Environment
        if: ${{ github.event.inputs.BUILD_NOCCACHE == 'false' }}
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FILE }}" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.FILE }}"
          echo "set: $HOME/.ccache_${{ github.event.inputs.FILE }}"

      # -----------------------------
      # Configure Git
      # -----------------------------
      - name: Configure Git
        run: |
          git config --global user.name "KingMikhail"
          git config --global user.email "andreimikhail1987@gmail.com"

      # -----------------------------
      # Install Dependencies + APTC
      # -----------------------------
      - name: Install Dependencies + APTC
        uses: awalsh128/cache-apt-pkgs-action@latest 
        with: 
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix kmod libdw-dev elfutils
          execute_install_scripts: true

      # -----------------------------
      # Restore Ccache
      # -----------------------------
      - name: Restore Ccache
        if: ${{ github.event.inputs.BUILD_NOCCACHE == 'false' }}
        uses: actions/cache@v3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-${{ env.BUILD_METHOD }}-${{ github.event.inputs.FAST_BUILD == 'true' && 'alpha' || 'beta' }}-16.1

      # -----------------------------
      # Initialize Ccache
      # -----------------------------
      - name: Initialize Ccache
        if: ${{ github.event.inputs.BUILD_NOCCACHE == 'false' }}
        run: |
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              echo "Initialization ccache (${{ env.CCACHE_DIR }})..."
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "Ccache Initialization Complete"
            else
              echo "Ccache has been Initialized, Skip this Step"
            fi
          else
            echo "Skip if Ccache is Not Installed"
          fi
          ccache -s
          
      # -----------------------------
      # Install Repo Tool
      # -----------------------------
      - name: Install Repo Tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      # -----------------------------
      # Initialize Repo and Sync
      # -----------------------------
      - name: Initialize Repo and Sync
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          mkdir -p .repo/manifests
          cp "$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml" ".repo/manifests/${FILE}.xml"
          BASE_URL="https://github.com/${MANIFEST_REPO}/${MANIFEST_REPO_NAME}.git"

          echo "Initialize Tepository using $MANIFEST_REPO/$MANIFEST_REPO_NAME($MANIFEST_BRANCH)..."
          repo init -u "$BASE_URL" -b "$MANIFEST_BRANCH" -m "${FILE}.xml" --depth=1 --no-clone-bundle --no-tags
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync

          for dir in kernel_platform/common kernel_platform/msm-kernel; do
            if [ -e "$dir/BUILD.bazel" ]; then
              sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' "$dir/BUILD.bazel"
            fi
            rm -f "$dir/android/abi_gki_protected_exports_"* 2>/dev/null || echo "No protected exports in $dir"
          done

      # -----------------------------
      # Kernel Version Handling
      # -----------------------------
      - name: Kernel Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          # Get Android kernel Version Number and Kernel Version Number
          for f in ./common/build.config.constants ./common/build.config.common; do
            if [ -f "$f" ]; then
              BRANCH=$(grep -m1 '^BRANCH=' "$f" | cut -d= -f2)
              [ -n "$BRANCH" ] && break
            fi
          done
          if [[ -z "$BRANCH" && -n "$PATH_2" ]]; then
            BRANCH=$(sed -n '2p' "./$PATH_2/android/ACK_SHA" | awk -F'-' '{print $1"-"$2}')
          fi
          if [ -n "$BRANCH" ]; then
            echo "KANDROID_VERSION=${BRANCH%-*}" >> $GITHUB_ENV
            echo "KERNEL_VERSION=${BRANCH#*-}" >> $GITHUB_ENV
          else
            echo "No Branch Found in build.config* and ACK_SHA Files"
          fi

          # Obtain Full Kernel Version Number and Optional Kernel Level Modification from Makefile
          ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)

          # Force Modification of Sublevel 
          SUBLEVEL_INPUT="${{ github.event.inputs.SUBLEVEL }}"
          if [ -n "$SUBLEVEL_INPUT" ]; then
            echo "Revise Sublevel for $SUBLEVEL_INPUT"
            sed -i "s/^\(SUBLEVEL[[:space:]]*=[[:space:]]*\).*/\1$SUBLEVEL_INPUT/" ./common/Makefile
          else
            echo "Sublevel is Not Specified; Default Value will be Retained"
          fi

          # Read Modified Version
          NEW_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)

          if [ "$ORIG_VERSION" != "$NEW_VERSION" ]; then
            echo "Kernel Version:$ORIG_VERSION->$NEW_VERSION"
            echo "TKERNEL_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          else
            echo "Kernel Version:$ORIG_VERSION No changes"
            echo "TKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV
          fi

          # Kernel Version Number Conversion for Comparison
          KV_TMP="${BRANCH#*-}"
          echo "KV1=$(echo "$KV_TMP" | cut -d. -f1)" >> $GITHUB_ENV
          echo "KV2=$(echo "$KV_TMP" | tr -d '.')" >> $GITHUB_ENV
          echo "KV3=$(echo "$NEW_VERSION" | tr -d '.')" >> $GITHUB_ENV

      - name: Rust Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          # Read Build Config Constants from Rustc Version
          RUSTC_VERSION=""
          if [[ -f ./common/build.config.constants ]]; then
            RUSTC_VERSION=$(grep '^RUSTC_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
          fi
          if [[ -n "$RUSTC_VERSION" ]]; then
            echo "RUSTC_VERSION=$RUSTC_VERSION"
            echo "RUSTC_VERSION=$RUSTC_VERSION" >> $GITHUB_ENV
            echo "ENABLE_RUST=true" >> $GITHUB_ENV
          else
            echo "Rustc Version Not Found; Rust Compilation is Disabled"
            echo "ENABLE_RUST=false" >> $GITHUB_ENV
          fi

      # Custom Kernel Suffix
      - name: Custom Kernel Suffix if Set
        if: ${{ github.event.inputs.SUFFIX != '' }}
        run: |
          cd kernel_workspace
          SUFFIX="${{ github.event.inputs.SUFFIX }}"
          KANDROID_VERSION="${{ env.KANDROID_VERSION }}"
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"

          for path in \
            kernel_platform/common/scripts/setlocalversion \
            kernel_platform/msm-kernel/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; do

            [ -f "$path" ] || continue

            echo "Modifying: $path"

            # Remove -dirty
            sed -i 's/ -dirty//g' "$path"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"

            if grep -q 'KERNELVERSION.*scm_version' "$path"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${SUFFIX}\"|" "$path"

            elif grep -q 'echo "\$res"' "$path"; then
              echo "Detected Old Set Local Version Format"
              if [ "$FAST_BUILD" = "true" ]; then
                echo "Fast Build Enabled: Using Static Res"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${SUFFIX}\"/" "$path"
              else
                echo "Standard Build: Injecting Suffix Via Cut/Echo"
                if [[ -f ./kernel_platform/build_with_bazel.py ]]; then
                  echo "When Compiling Using Official Script and when Using `Build with Bazel`, There may be a Limitation on Number of Special Symbols, if Compilation Fails Modify the Script"
                  echo "When Using Official Script and Building with Build with Bazel, Build may Fail Due to Limit on Number of Special Characters, Modify the Configuration if that Happens"
                fi
                tac "$path" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${SUFFIX}; echo \"\\\$res\";/" | tac > "$path.tmp" && mv "$path.tmp" "$path"
              fi
            else
              echo "Unknown Format, Appending Echo Manually"
              echo "echo \"\$res-${SUFFIX}\"" >> "$path"
            fi

            chmod +x "$path"
          done

          git add -A
          git commit -m "Custom suffix & removed -dirty"

      # Random Suffix in Pseudo-Official Format (Only Works if Suffix is Not Set)*
      - name: Custom Kernel Random Suffix if Empty
        if: ${{ github.event.inputs.SUFFIX == '' }}
        run: |
          cd kernel_workspace
          KANDROID_VERSION="${{ env.KANDROID_VERSION }}"
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"

          # Generate Random Numbers and Random Hashes
          RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
          RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
          RANDOM_SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"

          for path in \
            kernel_platform/common/scripts/setlocalversion \
            kernel_platform/msm-kernel/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; do

            [ -f "$path" ] || continue

            echo "Modifying: $path"

            # Remove -dirty
            sed -i 's/ -dirty//g' "$path"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"

            if grep -q 'KERNELVERSION.*scm_version' "$path"; then
              echo "Detected New Set Local Version Format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"|" "$path"

            elif grep -q 'echo "\$res"' "$path"; then
              echo "Detected Old Set local Version Format"
              if [ "$FAST_BUILD" = "true" ]; then
                echo "Fast Build Enabled: Using Static Res with Random Suffix"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"/" "$path"
              else
                echo "Standard Build: Injecting Random suffix Via Cut/Echo"
                tac "$path" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${RANDOM_SUFFIX}; echo \"\\\$res\";/" | tac > "$path.tmp" && mv "$path.tmp" "$path"
              fi
            else
              echo "Unknown Format, Appending Echo Manually"
              echo "echo \"\$res-${RANDOM_SUFFIX}\"" >> "$path"
            fi

            chmod +x "$path"
          done

          git add -A
          git commit -m "Random suffix & remove -dirty"
          
      # -----------------------------
      # Selected Root Manager
      # -----------------------------
      - name: Add Selected KSU Meta
        run: |
          # Go to Kernel Working Directory
          cd kernel_workspace/kernel_platform
          KSU_META="${{ github.event.inputs.KSU_META }}"
          if [[ "$KSU_META" == "SukiSU-Ultra" ]]; then
            echo "Configure SukiSU Ultra..."
            curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s builtin
            cd ./KernelSU
            
            # Get a Short Hash of Current Git Commit (8-Bits)
            GIT_COMMIT_HASH=$(git rev-parse --short=8 HEAD)
            echo "Current Commit Hash: $GIT_COMMIT_HASH"
            export KSU_VERSION=$KSU_VERSION
            
            # Try up to 3 Times to Get KernelSU API Version Number
            for i in {1..3}; do
            
              # Extract KSU API Version from Remote Kbuild
              KSU_API_VERSION=$(curl -s "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/Kbuild" | 
              
                # Look for First Line Containing Version Definition
                grep -m1 "KSU_VERSION_API :=" | 
                
                # Extract Value After Equal Sign
                awk -F'= ' '{print $2}' | 
                
                # Remove All Whitespace
                tr -d '[:space:]')
                
              # If Version Number is Successfully Obtained, Loop will be Exited, Otherwise Wait 1 Second and Try Again
              [ -n "$KSU_API_VERSION" ] && break || sleep 1
            done
            
            # If Acquisition Fails, Fallback to Default
            if [ -z "$KSU_API_VERSION" ]; then
               KSU_API_VERSION="3.1.7"
            fi

            
            # Store API Version Number to GitHub Environment Variable
            echo "KSU_API_VERSION=$KSU_API_VERSION" >> $GITHUB_ENV
            
            # Create Version Definition Template & Version Format Function: Use Obtained Commit Hash and Fixed Suffix
       
            # KSU Version API: API Version Definition
     
            # KSU Version Full: Full Version Definition
            VERSION_DEFINITIONS=$'define get_ksu_version_full\nv\\$1-'"$GIT_COMMIT_HASH"$'@Andrei\nendef\n\nKSU_VERSION_API := '"$KSU_API_VERSION"$'\nKSU_VERSION_FULL := v'"$KSU_API_VERSION"$'-'"$GIT_COMMIT_HASH"$'Andrei'
           
            # Cleanup Old Version Definitions in Kernel Kbuild
         
            # Delete Version Functions
            sed -i '/define get_ksu_version_full/,/endef/d' kernel/Kbuild
       
            # Delete API Version Definition
            sed -i '/KSU_VERSION_API :=/d' kernel/Kbuild
        
            # Delete Full Version Definition
            sed -i '/KSU_VERSION_FULL :=/d' kernel/Kbuild
       
            # Insert the New Version Definition After the Repo Owner Line
            awk -v def="$VERSION_DEFINITIONS" '
          
              # When Repo Owner Line is Found, Insert the Version Definition and Set Markup
              /REPO_OWNER :=/ {print; print def; inserted=1; next}
          
              # Print All Lines
              1
         
              # If No Insertion Point is Found, Append it at the End of the Document
              END {if (!inserted) print def}
            ' kernel/Kbuild > kernel/Kbuild.tmp && mv kernel/Kbuild.tmp kernel/Kbuild

            # Generate Custom Version Number (Based on Commit Count) to Use when it Fails 114514
            KSU_VERSION=$(expr $(git rev-list --count main) + 37185 2>/dev/null || echo 114514)
      
            # Store the Version Number to a GitHub Environment Variable
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "KSUVERSION=$KSU_VERSION" >> $GITHUB_OUTPUT

            # Validate the Results of the Modifications
            grep -A10 "REPO_OWNER" kernel/Kbuild  # Check the Contents After the Insertion Point
            grep "KSU_VERSION_FULL" kernel/Kbuild # Confirm that the Version Definition Exists
            echo "SukiSU-Ultra Version Number: v${KSU_API_VERSION}-${GIT_COMMIT_HASH}@Andrei"
            
          elif [[ "$KSU_META" == "ReSukiSU" ]]; then
            echo "Configure ReSukiSU..."
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@Andrei"' >> ./common/arch/arm64/configs/gki_defconfig
            cd ./KernelSU
           
            # Generate a Custom Version Number (Based on the Commit Count) to Use when it Fails 114514
            KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)
        
            # Store the Version Number to a GitHub Environment Variable
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "KSUVERSION=$KSU_VERSION" >> $GITHUB_OUTPUT
        
          elif [[ "$KSU_META" == "KernelSU-Next" ]]; then
            echo "Configure KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
            cd KernelSU-Next
            rm -rf .git
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "KSUVERSION=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g" kernel/Kbuild
            KSU_GIT_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -n 1 | sed 's/"name": "//;s/"//')
            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g" kernel/Kbuild
           
            # Add WildKSU Manager Support for KernelSU-Next
            cd ../common/drivers/kernelsu
            wget https://github.com/KingMikhail/Action-Build/raw/refs/heads/LiquidAndrei/patches/apk_sign.patch
            patch -p2 -N -F 3 < apk_sign.patch || true
         
          elif [[ "$KSU_META" == "MKernelSU" ]]; then
            echo "Configure MKSU (5ec1cff/KernelSU)..."
            curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
            cd ./KernelSU
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/5ec1cff/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "KSUVERSION=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
          
          elif [[ "$KSU_META" == "KernelSU" ]]; then
            echo "Configure KernelSU (tiann/KernelSU)..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
            cd ./KernelSU
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "KSUVERSION=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
          else
            echo "No Built-in KernelSU Mode has been Selected to Skip KernelSU Configuration..."
          fi

      # -----------------------------
      # Patches
      # -----------------------------
      - name: Apply KSU META, SUSFS, ZRAM, and Legacy Kernel Patches
        if: inputs.susfs_enable
        run: |
          set -euo pipefail

          # -----------------------------
          # Environment Setup
          # -----------------------------
          KSU_META="${{ github.event.inputs.KSU_META }}"
          ANDROID_VERSION="${{ env.ANDROID_VERSION }}"
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          KANDROID_VERSION="${{ env.KANDROID_VERSION }}"
          SUSFS_META="${{ github.event.inputs.SUSFS_META }}"
          XUS_FIX="${{ github.event.inputs.XUS_FIX }}"
          FILE="${{ github.event.inputs.FILE }}"
          ZRAM="${{ github.event.inputs.ZRAM }}"
          WORKDIR="kernel_workspace"
          cd "$WORKDIR"

          # -----------------------------
          # Helper Functions
          # -----------------------------
          clone_susfs() {
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${ANDROID_VERSION}-${KERNEL_VERSION}
          }

          download_patch() {
            local url="$1"
            local dest="$2"
            wget "$url" -O "$dest"
          }

          copy_common_patches() {
            mkdir -p common/fs common/include/linux
            cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch ./common/
            cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          }

          apply_patch() {
            local patch_file="$1"
            local options="${2:-}"
            if [ -f "$patch_file" ]; then
              patch -p1 $options < "$patch_file" || echo "Warning: Failed to Apply $patch_file"
            else
              echo "Patch $patch_file Not Found, Skipping..."
            fi
          }

            fix_vma_undeclared() {
              sed -i 's|vma = find_vma(mm|struct vm_area_struct *&|' ./fs/proc/task_mmu.c
          }

            fix_ksu_makefile_patch() {
            local patch_file="$1"
            if [ -f "$patch_file" ] && grep -q "a/kernel/Makefile" "$patch_file"; then
              sed -i 's|kernel/Makefile|kernel/Kbuild|g' "$patch_file"
              sed -i 's|^@@ .* format:.*|@@ -94,4 +94,13 @@|' "$patch_file"
              sed -i 's|.*check-format:.*| ccflags-y += -Wno-strict-prototypes -Wno-int-conversion -Wno-gcc-compat -Wno-missing-prototypes|' "$patch_file"
              sed -i 's|.*clang-format --dry-run.*| ccflags-y += -Wno-declaration-after-statement -Wno-unused-function -Wno-unused-variable|' "$patch_file"
            fi
          }

          # -----------------------------
          # Apply KSU META Specific Patches
          # -----------------------------
          case "$KSU_META" in
            SukiSU-Ultra|ReSukiSU|KernelSU-Next|MKernelSU|KernelSU)
              echo "Applying Patches for KSU META: $KSU_META"
              clone_susfs
              download_patch "https://github.com/KingMikhail/Action-Build/raw/refs/heads/LiquidAndrei/patches/69_hide_stuff.patch" ./common/69_hide_stuff.patch
              copy_common_patches

              [[ "$KSU_META" == "ReSukiSU" ]] && fix_vma_undeclared

              if [[ "$KSU_META" == "KernelSU" || "$KSU_META" == "MKernelSU" ]]; then
                mkdir -p KernelSU
                cp ./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
                fix_ksu_makefile_patch ./KernelSU/10_enable_susfs_for_ksu.patch
                cd KernelSU
                apply_patch 10_enable_susfs_for_ksu.patch

                if [[ "$KSU_META" == "MKernelSU" ]]; then
                  download_patch "https://github.com/KingMikhail/Action-Build/raw/refs/heads/LiquidAndrei/patches/mksu_supercalls.patch" ./mksu_supercalls.patch
                  apply_patch mksu_supercalls.patch
                fi
                cd ../common
              fi

              apply_patch 50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch
              [[ "$KSU_META" == "KernelSU-Next" || "$KSU_META" == "MKernelSU" || "$KSU_META" == "KernelSU" ]] && apply_patch 69_hide_stuff.patch "-N -F 3" || apply_patch 69_hide_stuff.patch
              ;;

            *)
              echo "No Builtin KSU Type Selected, Skipping SUSFS Configuration"
              ;;
          esac

          # -----------------------------
          # Apply Optional SUSFS META Patches
          # -----------------------------
          if [[ "$SUSFS_META" != "-1" ]]; then
            echo "Applying SUSFS META Patches..."
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${KANDROID_VERSION}-${KERNEL_VERSION}${{ github.event.inputs.SUSFS_DEV == 'true' && '-dev' || '' }}
            cd susfs4ksu
            [[ "$SUSFS_META" =~ ^[0-9]+$ ]] && git checkout HEAD~$SUSFS_META || git checkout "$SUSFS_META"
            cd ..

            git clone https://github.com/ShirkNeko/SukiSU_patch.git
            git clone https://github.com/KingMikhail/Action-Build.git

            cd kernel_platform
            download_patch "https://github.com/KingMikhail/Action-Build/raw/refs/heads/LiquidAndrei/patches/69_hide_stuff.patch" ./common/69_hide_stuff.patch
            cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${KANDROID_VERSION}-${KERNEL_VERSION}.patch ./common/
            cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

            # -----------------------------
            # Apply ZRAM Patch
            # -----------------------------
            if [[ "$ZRAM" == 1/* ]]; then
              echo "Applying SUKISU ZRAM patches..."
              cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux/
              cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib/
              cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto/
              cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
            fi

            # -----------------------------
            # Legacy 5.15 Kernel Fix Patch
            # -----------------------------
            GKI_V="${KANDROID_VERSION}-${KERNEL_VERSION}"
            SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | head -n1 | cut -d= -f2 | tr -d ' ')
            if [[ "$GKI_V" == "android13-5.15" && -n "$SUBLEVEL" && "$SUBLEVEL" -lt 123 ]]; then
              echo "Applying Legacy 5.15 Kernel Fix..."
              cp ../../Action-Build/patches/fix_5.15.legacy ./fix_5.15.legacy.patch
              apply_patch fix_5.15.legacy.patch
              echo "Legacy 5.15 Patch Applied"
            fi

            cd common
            apply_patch 50_add_susfs_in_gki-${KANDROID_VERSION}-${KERNEL_VERSION}.patch
            apply_patch 69_hide_stuff.patch
            echo "SUSFS META Patching Complete"
          else
            echo "SUSFS META is -1, Skipping SUSFS META Patches"
          fi

          # -----------------------------
          # Optional OGKI → GKI Conversion
          # -----------------------------
          if [[ ${{ startsWith(env.KERNEL_VERSION, '6.') && github.event.inputs.SCHED == 'false' }} ]]; then
            PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
            cd kernel_platform/common
            sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
            patch -p1 -F 3 < "${PATCH_DIR}/hmbird_patch.patch" || true
            echo "OGKI → GKI Conversion Patches Applied"
          fi            

      # -----------------------------
      # Unicode Bypass Fix Patches
      # -----------------------------
      - name: Apply Unicode Bypass
        if: ${{ github.event.inputs.UNICODE_BYPASS == 'true' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          if [[ -n "$KV1" && "$KV1" -lt 6 ]]; then
            patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1+.patch" || true
          fi

      # -----------------------------
      # ZRAM
      # -----------------------------
      - name: Apply ZRAM
        if: startsWith(github.event.inputs.ZRAM, '1/')
        run: |
          ZRAM="${{ github.event.inputs.ZRAM }}"
          if [[ "$(grep -o '/' <<< "$ZRAM" | wc -l)" -lt 2 ]]; then
            echo "Error: ZRAM Parameter is Missing Necessary Separator '/'. Format Should Be: Main Switch 0 Off 1 On / Algorithm Name (0 at the Beginning is Invalid) / Size (0 at the Beginning is Invalid)"
            exit 10
          fi
          # Parsing Fields: Switch Status / Algorithm Name / Size
          IFS='/' read -r ZRAM_SWSTA ZRAM_ALGO ZRAM_SIZE EXTRA <<< "$ZRAM"
          if [ -n "$EXTRA" ]; then
             echo "Invalid ZRAM Format"
             exit 1
          fi
          echo "ZRAM_ALGO=$ZRAM_ALGO" >> $GITHUB_ENV
          echo "ZRAM_ALGO_U=${ZRAM_ALGO^^}" >> $GITHUB_ENV
          echo "ZRAM_SIZE=$ZRAM_SIZE" >> $GITHUB_ENV

          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}"
          cd kernel_workspace/kernel_platform/common
          echo "Patches LZ4KD is Being Applied"
          patch -p1 -F 3 < "${PATCH_DIR}/lz4kd.patch" || true
          echo 'LZ4KD Patches Complete'
          echo "Patches LZ4K OPlus is Being Applied"
          patch -p1 -F 3 < "${PATCH_DIR}/lz4k_oplus.patch" || true
          echo 'LZ4K OPlus Patches Complete'

      # -----------------------------
      # Sched Windspeed Fengchi
      # -----------------------------
      - name: Apply Sched
        env:
          FILE: ${{ github.event.inputs.FILE }}
        if: ${{ github.event.inputs.SCHED == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [ -d "$p" ] && {
              echo "The code for Fengchi already exists in the source code; enable secondary rollback"
              exit 0
            }
          done
          git clone https://github.com/KingMikhail/Kernel-Hmbird-Patch.git -b $CPU || { echo "CPU Branch does not Exist, fengchi Kernel does not Currently Support your Device Model, Close and Try Again"; exit 11; }
          echo "Pulling Windspeed Patches"
          cp ./Kernel-Hmbird-Patch/fengchi_${FILE}.patch ./
          if [[ -f "fengchi_${FILE}.patch" ]]; then
            echo "Applying Windspeed Patches"
            dos2unix "fengchi_${FILE}.patch"
            patch -p1 -F 3 < "fengchi_${FILE}.patch"
            echo "Windspeed Patches complete"
          else
            echo "No Patch Found, Windspeed Kernel does not Currently Support your Device Model, Close and Try Again"
            exit 12
          fi
          
      # -----------------------------
      # LSM Baseband Guard
      # -----------------------------
      - name: Apply LSM Baseband Guard
        if: ${{ github.event.inputs.LSM == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          echo "Enabling kernel-level baseband protection support..."
          curl -LSs https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/fix_blkdev_rename/setup.sh | bash -s fix_blkdev_rename
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' ./security/Kconfig

      # -----------------------------
      # Configuration Information, Marked with * Indicates Additional Items, Which Carry a Certain Degree of Risk and Uncertainty
      # -----------------------------
      - name: Add Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform/common
          CONFIG_FILE=./arch/arm64/configs/gki_defconfig
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"

          # Selected Root Configuration
          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y" >> "$CONFIG_FILE"

          # KPM Configuration
          case "${{ github.event.inputs.KPM }}" in
            KPM)
              echo "CONFIG_KPM=y" >> "$CONFIG_FILE"
              ;;
            KPN|NoN)
              echo "CONFIG_KPM=n" >> "$CONFIG_FILE"
              ;;
          esac

          # SUSFS Configuration
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"
          else
            echo "CONFIG_KSU_SUSFS=n" >> "$CONFIG_FILE"
          fi

          # Mountify TMPFS Configuration*
          echo "CONFIG_TMPFS_XATTR=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$CONFIG_FILE"

          # BBR and ECN Configuration*
          if [ "${{ github.event.inputs.BBR_ECN }}" = "true" ]; then
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$CONFIG_FILE"
            echo "CONFIG_TCP_CONG_BBR=y" >> "$CONFIG_FILE"
            echo "CONFIG_NET_SCH_FQ=y" >> "$CONFIG_FILE"
            echo "CONFIG_TCP_CONG_BIC=n" >> "$CONFIG_FILE"
            echo "CONFIG_TCP_CONG_WESTWOOD=n" >> "$CONFIG_FILE"
            echo "CONFIG_TCP_CONG_HTCP=n" >> "$CONFIG_FILE"
            echo "CONFIG_IP_ECN=y" >> "$CONFIG_FILE"
            echo "CONFIG_TCP_ECN=y" >> "$CONFIG_FILE"
            echo "CONFIG_IPV6_ECN=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_NF_TARGET_ECN=y" >> "$CONFIG_FILE"
          fi

          # ZRAM Configuration*
          if [[ "${{ github.event.inputs.ZRAM }}" == 1/* ]]; then
            echo "CONFIG_CRYPTO_LZ4HC=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_LZ4K=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_842=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_LZ4K_OPLUS=y" >> "$CONFIG_FILE"
            echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE"
          fi

          # LSM Baseband Guard Configuration*
          if [ "${{ github.event.inputs.LSM }}" = "true" ]; then
            echo "CONFIG_BBG=y" >> "$CONFIG_FILE"
          fi

          # IPSet and IPV6 NAT Configuration
          if [[ "$CPU" == sm* && "${{ github.event.inputs.NETFILTER }}" == "true" ]]; then

            echo "Applying IPSET & IPv6 NAT configuration..."

            enable_config() {
              local option="$1"
              sed -i "/^${option}=*/d" "$CONFIG_FILE"
              echo "${option}=y" >> "$CONFIG_FILE"
            }

            set_config_value() {
              local option="$1"
              local value="$2"
              sed -i "/^${option}=*/d" "$CONFIG_FILE"
              echo "${option}=${value}" >> "$CONFIG_FILE"
            }

            # Kernel-specific condition
            if [[ "$KERNEL_VERSION" != "6.12" ]]; then
              enable_config CONFIG_BPF_STREAM_PARSER
            else
              echo "Skipping CONFIG_BPF_STREAM_PARSER for kernel 6.12"
            fi

            # Netfilter / IPSet Core
            enable_config CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
            enable_config CONFIG_NETFILTER_XT_SET
            enable_config CONFIG_IP_SET

            # IPSet Max Size
            set_config_value CONFIG_IP_SET_MAX 65534

            # Bitmap Support
            enable_config CONFIG_IP_SET_BITMAP_IP
            enable_config CONFIG_IP_SET_BITMAP_IPMAC
            enable_config CONFIG_IP_SET_BITMAP_PORT

            # Hash Types
            enable_config CONFIG_IP_SET_HASH_IP
            enable_config CONFIG_IP_SET_HASH_IPMARK
            enable_config CONFIG_IP_SET_HASH_IPPORT
            enable_config CONFIG_IP_SET_HASH_IPPORTIP
            enable_config CONFIG_IP_SET_HASH_IPPORTNET
            enable_config CONFIG_IP_SET_HASH_IPMAC
            enable_config CONFIG_IP_SET_HASH_MAC
            enable_config CONFIG_IP_SET_HASH_NETPORTNET
            enable_config CONFIG_IP_SET_HASH_NET
            enable_config CONFIG_IP_SET_HASH_NETNET
            enable_config CONFIG_IP_SET_HASH_NETPORT
            enable_config CONFIG_IP_SET_HASH_NETIFACE

            # List Type
            enable_config CONFIG_IP_SET_LIST_SET

            # IPV6 NAT
            enable_config CONFIG_IP6_NF_NAT
            enable_config CONFIG_IP6_NF_TARGET_MASQUERADE

            echo "IPSET & IPV6 NAT Configuration Applied Successfully"

          else
            echo "Skipping IPSET and IPV6 NAT Configuration"
          fi

          # Fix Build Issues
          if [ "$KERNEL_VERSION" = "6.1" ] && [[ "$CPU" == mt* ]]; then
            echo "CONFIG_DEBUG_INFO_BTF=n" >> "$CONFIG_FILE"
          fi
          if [[ "$ENABLE_RUST" == "true" ]]; then
            echo "CONFIG_RUST=y" >> "$CONFIG_FILE"
            echo "CONFIG_ANDROID_BINDER_IPC_RUST=m" >> "$CONFIG_FILE"
          fi

          # Remove Build Review
          sed -i 's/check_defconfig//' ./build.config.gki
          
      # -----------------------------
      # BetterNet
      # -----------------------------
      - name: Fix IPV6 NAT Error
        if: ${{ github.event.inputs.NETFILTER == 'true' }}
        run: |
          set -e

          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common

          echo "Detected CPU: ${CPU:-undefined}"

          # Apply Patch Only for Snapdragon (sm*) Platforms
          if [[ "$CPU" == sm* ]]; then
            echo "Applying IPV6 NAT Fix Patch..."
      
            if [ -f "${PATCH_DIR}/IPv6_NAT_FIX.patch" ]; then
              patch -p1 -F 3 < "${PATCH_DIR}/IPv6_NAT_FIX.patch"
              echo "IPV6 NAT Fix Applied Successfully"
            else
              echo "Patch File Not Found: IPv6_NAT_FIX.patch"
            fi

          else
            echo "Non-Snapdragon Platform Detected, Skipping IPV6 NAT Fix"
          fi

      # -----------------------------
      # Custom Kernel Build Time, Without Adding #1 SMP PREEMPT
      # -----------------------------
      - name: Custom Build Time
        shell: bash
        run: |
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using Input Build Time: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "Using UTC Time as Fallback: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd kernel_workspace/kernel_platform/
          for f in common/scripts/mkcompile_h msm-kernel/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching MKCompileh with Build Time=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done

      # -----------------------------
      # Disable GPUEB
      # -----------------------------
      - name: Disable GPUEB
        if: ${{ env.KERNEL_VERSION == '5.10' && startsWith(env.CPU, 'mt') }}
        run: |
          echo "Disabling GPUEB for MTK Kernel 5.10"
          sed -i '/obj-y.*gpueb/d' kernel_workspace/kernel-5.10/drivers/gpu/mediatek/Makefile

      # -----------------------------
      # Fast Build
      # -----------------------------
      - name: Build Kernel Fast
        if: ${{ github.event.inputs.FAST_BUILD == 'true' }}
        id: fast_build
        run: |
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          echo "fallback=false" >> "$GITHUB_OUTPUT"
          cd kernel_workspace/kernel_platform

          # Automatic Detection of LLVM IAS
          if [[ -f ./common/build.config.arm ]] && grep -q '^LLVM_IAS=1' ./common/build.config.arm; then
            USE_LLVM_IAS=true
          else
            USE_LLVM_IAS=false
          fi

          # Ensure Path-2 is Defined
          PATH_2="${PATH_2:-}"

          # Read Clang Prebuilt Bin from Build Config Common
          CLANG_PREBUILT_BIN=""
          for f in ./common/build.config.common ${PATH_2:+./$PATH_2/build.config.common}; do
          [[ -f "$f" ]] || continue
          CLANG_PREBUILT_BIN=$(grep '^CLANG_PREBUILT_BIN=' "$f" | cut -d'=' -f2)
          [[ -n "$CLANG_PREBUILT_BIN" ]] && break
          done
          if [[ -z "$CLANG_PREBUILT_BIN" ]]; then
            echo "Clang Prebuilt Bin was Not Found in Build Config Common, Revert to Official Build Script"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "Consider Disabling Fast Build and Submit an Issue"
            exit 0
          fi

          # Try Extracting the Clang-r Version from Clang Prebuilt Bin First
          if [[ "$CLANG_PREBUILT_BIN" =~ (clang-r[0-9a-z]+) ]]; then
            CLANG_VERSION="${BASH_REMATCH[1]}"
          else
            # If No Match Found, Try Extracting from Build Config Constants
            if [[ -f ./common/build.config.constants ]]; then
              CLANG_VERSION=$(grep '^CLANG_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
            fi
          fi

          if [[ -z "$CLANG_VERSION" ]]; then
            echo "Unable to Obtain the Clang Version from Clang Prebuilt Bin or Build Config Constants; Reverting to Official Build Script"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "Consider disabling Fast Build and Submit an Issue"
            exit 0
          fi

          # Replace with New Clang Version Value
          CLANG_PREBUILT_BIN=${CLANG_PREBUILT_BIN/\$\{CLANG_VERSION\}/$CLANG_VERSION}
          # Get First Directory Name of Clang Prebuilt Bin and Assign it to Clang Dir
          CLANG_DIR=$(echo "$CLANG_PREBUILT_BIN" | cut -d'/' -f1)
          # Get Parent Directory Name of Clang Prebuilt Bin and Assign it to Clang Path
          CLANG_PATH=$(basename "$(dirname "$CLANG_PREBUILT_BIN")")

          echo "-----------------------------"
          echo "CLANG_VERSION=$CLANG_VERSION"
          echo "CLANG_DIR=$CLANG_DIR"
          echo "CLANG_PATH=$CLANG_PATH"
          echo "USE_LLVM_IAS=$USE_LLVM_IAS"
          echo "-----------------------------"

          set +u
          source "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/build/kernel/_setup_env.sh" 2>/dev/null || true
          set -u

          export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN:$PATH"
          export PATH="/usr/lib/ccache:$PATH"

          if [[ "$ENABLE_RUST" == "true" ]]; then
            export BINDGEN="bindgen"
            export LIBCLANG_PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$(dirname "$CLANG_PREBUILT_BIN")/lib"
          fi

          cd ./common

          # Remapping physical paths
          MAP="-fdebug-prefix-map=${GITHUB_WORKSPACE}=."
          MPMAP="-fmacro-prefix-map=${GITHUB_WORKSPACE}=."
          FPMAP="-ffile-prefix-map=${GITHUB_WORKSPACE}=."

          MAKE_ARGS=(
            LLVM=1
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CC="ccache clang"
            HOSTCC="ccache clang"
            LD=ld.lld
            HOSTLD=ld.lld
            PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole
            KCFLAGS+="$MAP $MPMAP $FPMAP"
            KCFLAGS+=-Wno-error
            KCFLAGS+=-D__ANDROID_COMMON_KERNEL__
          )

          if [[ "$USE_LLVM_IAS" == "true" ]]; then
            MAKE_ARGS=(LLVM_IAS=1 "${MAKE_ARGS[@]}")
          fi
          if [[ "$ENABLE_RUST" == "true" ]]; then
            MAKE_ARGS=(RUSTC=../../prebuilts/rust/linux-x86/$RUSTC_VERSION/bin/rustc "${MAKE_ARGS[@]}")
          fi
          make O=out "${MAKE_ARGS[@]}" gki_defconfig
          if [[ "$KERNEL_VERSION" == "5.10" || "$KERNEL_VERSION" == "5.15" ]]; then
            echo ">> Setup LTO = thin"
            scripts/config --file out/.config -e LTO_CLANG
            scripts/config --file out/.config -e LTO_CLANG_THIN
            scripts/config --file out/.config -d LTO_CLANG_NONE
            scripts/config --file out/.config -d LTO_CLANG_FULL
          fi

          if [[ "$KERNEL_VERSION" == "6.12" ]]; then
            echo ">> Setup LTO = none"
            scripts/config --file out/.config -e LTO_CLANG
            scripts/config --file out/.config -e LTO_CLANG_NONE
            scripts/config --file out/.config -d LTO_CLANG_THIN
            scripts/config --file out/.config -d LTO_CLANG_FULL
          fi
          make O=out "${MAKE_ARGS[@]}" olddefconfig
          make -j"$(nproc --all)" O=out "${MAKE_ARGS[@]}"
          ccache -s

      # -----------------------------
      # Fallback to Build Kernel
      # -----------------------------
      - name: Fallback to Build Kernel
        if: ${{ github.event.inputs.FAST_BUILD == 'false' || steps.fast_build.outputs.fallback == 'true' }}
        run: |
          cd kernel_workspace
          if [ -f ./kernel_platform/build_with_bazel.py ]; then
            ./kernel_platform/oplus/bazel/oplus_modules_variant.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
            ./kernel_platform/build_with_bazel.py -t ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
          else
            LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
          fi

      # -----------------------------
      # Clone AnyKernel3 Repository
      # -----------------------------
      - name: Make AnyKernel3
        run: |
          git clone https://github.com/KingMikhail/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find/
          image_path=""
          if [ -d "./kernel_workspace/kernel_platform/common/out/" ]; then
            image_path=$(find "./kernel_workspace/kernel_platform/common/out/" -name "Image" | head -n 1)
            if [ -n "$image_path" ]; then
              echo "Unified Path Used By Make For Compilation Successfully Located Image File"
            fi
          fi
          if [ -z "$image_path" ] && [ -d "./kernel_workspace/kernel_platform/out/" ]; then
            image_path=$(find "./kernel_workspace/kernel_platform/out/" -name "Image" | head -n 1)
            if [ -n "$image_path" ]; then
              echo "Image File Was Successfully Found After Compiling Using Official Script"
            fi
          fi
          if [ -z "$image_path" ]; then
            echo "Image File Not Found, Build Failed" >&2
            exit 1
          fi
          if [ -f "$image_path" ]; then
            echo "Image File Finally Located at: $image_path"
            cp "$image_path" ./AnyKernel3/Image
            cp "$image_path" kernel_workspace/kernel_platform/out/Final-Image-Find/Image
          fi
          
      # -----------------------------
      # SukiSU and ReSukiSU Builtin KPM Function
      # -----------------------------
      - name: Apply Patch Linux and Replace Image
        if: ${{ github.event.inputs.KPM == 'KPM' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/kpm"
          OUT_DIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/out/Final-Image-Find"
          cd "${OUT_DIR}"
          cp "${PATCH_DIR}/patch_linux" .
          chmod +x patch_linux
          ./patch_linux
          rm -f Image
          mv oImage Image
          cp Image "${GITHUB_WORKSPACE}/AnyKernel3/Image"

      # -----------------------------
      # Zip Suffix
      # -----------------------------
      - name: Set Zip Suffix
        id: suffix
        run: |
          echo "value=${{ env.ZRAM_ALGO_U && format('_{0}', env.ZRAM_ALGO_U) || '' }}${{ github.event.inputs.KPM == 'KPM' && '_KPM' || github.event.inputs.KPM == 'KPN' && '_KPN' || '' }}${{ github.event.inputs.LSM == 'true' && '_LSM' || '' }}_ILH${{ github.event.inputs.SCHED== 'true' && '_SCHED' || '' }}" >> $GITHUB_OUTPUT

      # -----------------------------
      # Upload AnyKernel3 Zip
      # -----------------------------
      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AK3-${{ github.event.inputs.KSU_META }}-${{ env.KSUVER }}-${{ github.run_number }}
          path: ./AnyKernel3/*
          
      # -----------------------------
      # Extract and Process ZRAM Module
      # -----------------------------
      - name: Extract and Process ZRAM Module
        if: startsWith(github.event.inputs.ZRAM, '1/')
        id: zram_find
        run: |
          set -e
          ZRAM_ZIP="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/ZRAM.zip"

          if [ ! -f "$ZRAM_ZIP" ]; then
            echo "ZRAM.zip Not Found: $ZRAM_ZIP"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unzip "$ZRAM_ZIP" -d ZRAM-Module

          CONFIG_PROP="ZRAM-Module/config.prop"
          if [ -f "$CONFIG_PROP" ]; then
            echo "Revise config.prop"
            sed -i "s/^ZRAM_ALGO=.*/ZRAM_ALGO=${ZRAM_ALGO}/" "$CONFIG_PROP"
            sed -i "s/^ZRAM_SIZE=.*/ZRAM_SIZE=${ZRAM_SIZE}/" "$CONFIG_PROP"
            echo "ZRAM_ALGO=${ZRAM_ALGO}"
            echo "ZRAM_SIZE=${ZRAM_SIZE}"
          else
            echo "Not Found Config.prop"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target="./ZRAM-Module/zram/zram.ko"
          echo "Find the zram.ko module file..."
          search_paths=(
            "./kernel_workspace/kernel_platform/out"
            "./kernel_workspace/device/qcom"
          )
          zram_path=""
          for path in "${search_paths[@]}"; do
            if [ -d "$path" ]; then
              zram_path=$(find "$path" -type f -name "zram.ko" | head -n 1)
              [ -n "$zram_path" ] && break
            fi
          done
          if [ -z "$zram_path" ]; then
            zram_path=$(find "./kernel_workspace" -type f -name "zram.ko" | head -n 1)
          fi
          if [ -n "$zram_path" ] && [ -f "$zram_path" ]; then
            echo "ZRAM.ko File Finally Located at: $zram_path"
            install -D "$zram_path" "$target"
          else
            echo "ZRAM.ko File was Not Found, Possibly Due to an Unsupported Kernel Version or a Build Failure"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      # -----------------------------
      # Upload ZRAM Module
      # -----------------------------
      - name: Upload ZRAM Module
        if: startsWith(github.event.inputs.ZRAM, '1/') && steps.zram_find.outputs.upload != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ZRAM-Module_${{ env.KERNEL_VERSION }}_${{ steps.extract_info.outputs.value }}
          path: ZRAM-Module/*

      # -----------------------------
      # Post-build Disk Check
      # -----------------------------
      - name: Post-build Disk Check
        run: df -h
